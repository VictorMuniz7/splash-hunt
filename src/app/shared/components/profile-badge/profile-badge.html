<div class="relative">
  <button
    type="button"
    class="flex h-8 w-8 cursor-pointer items-center justify-center overflow-hidden rounded-full border border-splash-gold/30 bg-black/30 transition hover:border-splash-gold/60"
    [attr.aria-label]="'Profile'"
    (click)="toggle()"
  >
    @if (supabase.isLoggedIn() && profileService.profile()?.avatarUrl; as avatarUrl) {
      <img [src]="avatarUrl" alt="" class="h-full w-full object-cover" />
    } @else if (supabase.isLoggedIn()) {
      <span class="text-xs font-semibold text-splash-gold">{{ initial() }}</span>
    } @else {
      <svg viewBox="0 0 24 24" class="h-4 w-4 text-splash-gold/70" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6" fill="currentColor" />
        <path d="M4 20c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5" fill="currentColor" />
      </svg>
    }
  </button>

  @if (open()) {
    <app-profile-panel (closed)="open.set(false)" />
  }
</div>
