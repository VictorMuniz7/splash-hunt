<button
  type="button"
  class="relative flex h-24 w-14 shrink-0 cursor-pointer flex-col items-center gap-1.5 pb-10 pt-3 text-[#f4e9d8] transition-transform hover:scale-105 sm:h-32 sm:w-[4.5rem]"
  (click)="activate.emit()"
>
  <div class="mode-flag pointer-events-none absolute inset-0 -z-10" [class]="fillClass()">
    <svg
      viewBox="0 0 100 100"
      preserveAspectRatio="none"
      class="absolute inset-0 h-full w-full"
      aria-hidden="true"
    >
      <polygon
        points="0,0 100,0 100,65 50,100 0,65"
        fill="none"
        stroke="var(--color-splash-gold)"
        stroke-width="2.5"
        vector-effect="non-scaling-stroke"
      />
    </svg>
  </div>
  @if (kind() === 'multiplayer') {
    <svg viewBox="0 0 24 24" class="h-6 w-6 text-splash-gold" aria-hidden="true">
      <circle cx="8" cy="8" r="3.2" fill="currentColor" />
      <path d="M2 20c0-3.5 2.8-6 6-6s6 2.5 6 6" fill="currentColor" />
      <circle cx="17" cy="7.5" r="2.6" fill="currentColor" opacity="0.6" />
      <path d="M13.2 20c0.35-3 2.4-5.1 4.9-5.1s4.35 1.8 4.9 4.5" fill="currentColor" opacity="0.6" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" class="h-6 w-6 text-splash-gold" aria-hidden="true">
      <path d="M12 2 L14.5 9 L22 11 L14.5 13 L12 20 L9.5 13 L2 11 L9.5 9 Z" fill="currentColor" />
    </svg>
  }
  <span class="w-full break-words px-1 text-center text-[10px] font-semibold uppercase leading-tight tracking-[0.1em]">{{
    label()
  }}</span>
</button>
