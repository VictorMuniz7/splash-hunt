<section
  #sceneRoot
  class="relative z-10 flex flex-1 flex-col items-center justify-center gap-10 px-4 py-10 opacity-0 sm:gap-14 sm:py-16"
>
  <p class="max-w-md text-center text-sm leading-relaxed text-[#cbb9d6]/80 sm:text-base">
    {{ i18n.t('menu.intro') }}
  </p>

  <div class="flex items-center justify-center gap-6 sm:gap-16">
    <button
      type="button"
      class="group relative flex cursor-pointer flex-col items-center gap-2"
      (click)="toggleVulto()"
      (mouseenter)="onOptionEnter($event)"
      (mouseleave)="onOptionLeave($event)"
    >
      <span [class]="ringClass(vultoActive())">
        <app-mode-icon [mode]="GameMode.Vulto" class="h-full w-full" />
      </span>
      <span class="text-[11px] uppercase tracking-[0.2em] text-[#cbb9d6]/70 sm:text-xs">{{
        i18n.t('menu.vultoLabel')
      }}</span>
      <span
        class="mode-tooltip pointer-events-none absolute top-full z-20 mt-2 w-40 -translate-y-2 rounded-lg border border-splash-gold/20 bg-[#150324]/95 p-2.5 text-center text-[11px] leading-snug text-[#cbb9d6]/90 opacity-0 shadow-lg shadow-black/40 sm:w-48"
      >
        {{ i18n.t('menu.vultoTooltip') }}
      </span>
    </button>

    <div class="relative flex flex-col items-center gap-3">
      <button
        type="button"
        class="relative flex h-36 w-36 cursor-pointer items-center justify-center rounded-full border-2 border-splash-gold/40 bg-gradient-to-br from-[#2a0940] to-[#0c0116] transition-transform hover:scale-[1.03] sm:h-48 sm:w-48"
        [attr.aria-label]="i18n.t('menu.startButton')"
        (mouseenter)="onStartHover($event)"
        (mouseleave)="onStartLeave($event)"
        (click)="onStart()"
      >
        <span
          class="start-glow pointer-events-none absolute -inset-4 rounded-full bg-splash-magenta/20 opacity-0 blur-2xl"
        ></span>

        <svg
          #playIcon
          viewBox="0 0 100 100"
          class="relative z-10 h-14 w-14 sm:h-16 sm:w-16"
          aria-hidden="true"
        >
          <path
            d="M27 15 Q22 50 27 85 Q59 67 88 50 Q59 33 27 15 Z"
            fill="none"
            stroke="rgba(201, 169, 89, 0.35)"
            stroke-width="1.5"
            stroke-linejoin="round"
          />
          <path
            d="M33 23 Q29 50 33 77 Q56 64 79 50 Q56 36 33 23 Z"
            fill="#0c0116"
            stroke="#c9a959"
            stroke-width="3"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <span class="text-xs uppercase tracking-[0.35em] text-splash-gold/80 sm:text-sm">{{
        i18n.t('menu.startLabel')
      }}</span>
    </div>

    <button
      type="button"
      class="group relative flex cursor-pointer flex-col items-center gap-2"
      (click)="togglePretoEBranco()"
      (mouseenter)="onOptionEnter($event)"
      (mouseleave)="onOptionLeave($event)"
    >
      <span [class]="ringClass(pbActive())">
        <app-mode-icon [mode]="GameMode.PretoEBranco" class="h-full w-full" />
      </span>
      <span class="text-center text-[11px] uppercase leading-tight tracking-[0.2em] text-[#cbb9d6]/70 sm:text-xs"
        >{{ i18n.t('menu.pbLabelLine1') }}<br />{{ i18n.t('menu.pbLabelLine2') }}</span
      >
      <span
        class="mode-tooltip pointer-events-none absolute top-full z-20 mt-2 w-40 -translate-y-2 rounded-lg border border-splash-gold/20 bg-[#150324]/95 p-2.5 text-center text-[11px] leading-snug text-[#cbb9d6]/90 opacity-0 shadow-lg shadow-black/40 sm:w-48"
      >
        {{ i18n.t('menu.pbTooltip') }}
      </span>
    </button>
  </div>
</section>
