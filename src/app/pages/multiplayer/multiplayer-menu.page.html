<section
  #sceneRoot
  class="relative z-10 flex flex-1 flex-col items-center gap-6 px-4 py-8 opacity-0 sm:py-10"
>
  <div class="flex flex-col items-center gap-3 text-center">
    <h2 class="title-font text-xl text-[#f4e9d8] sm:text-2xl">{{ i18n.t('mp.subtitle') }}</h2>
    <p class="max-w-md text-sm leading-relaxed text-[#cbb9d6]/80 sm:text-base">
      {{ i18n.t('mp.description') }}
    </p>
  </div>

  <div class="mt-6 flex flex-col items-center gap-4">
    @if (supabase.session()) {
      <p class="text-sm text-[#cbb9d6]/80">
        {{ i18n.t('mp.greeting') }}
        <span class="font-semibold text-splash-gold">{{ supabase.sessionNickname() }}</span>
      </p>
      <button
        type="button"
        class="cursor-pointer rounded-lg border-2 border-splash-gold/50 bg-splash-magenta/20 px-8 py-2.5 text-sm font-semibold uppercase tracking-widest text-[#f4e9d8] transition hover:bg-splash-magenta/30"
        (click)="goToRooms()"
      >
        {{ i18n.t('mp.play') }}
      </button>
    } @else if (enteringNickname()) {
      <div class="flex w-full max-w-sm flex-col items-center gap-3 sm:flex-row">
        <input
          type="text"
          class="w-full rounded-lg border border-splash-gold/25 bg-black/40 px-4 py-2.5 text-sm text-[#f4e9d8] outline-none transition placeholder:text-[#cbb9d6]/40 focus:border-splash-magenta/60"
          [placeholder]="i18n.t('mp.nicknamePlaceholder')"
          [value]="nickname()"
          (input)="nickname.set($any($event.target).value)"
          (keydown.enter)="confirmAnonymous()"
          maxlength="24"
          autofocus
        />
        <button
          type="button"
          class="w-full shrink-0 cursor-pointer rounded-lg border-2 border-splash-gold/50 bg-splash-magenta/20 px-6 py-2.5 text-sm font-semibold uppercase tracking-widest text-[#f4e9d8] transition hover:bg-splash-magenta/30 disabled:cursor-not-allowed disabled:opacity-30 sm:w-auto"
          [disabled]="!nickname().trim() || submitting()"
          (click)="confirmAnonymous()"
        >
          {{ i18n.t('mp.confirm') }}
        </button>
      </div>
      @if (error(); as err) {
        <p class="text-xs text-splash-wine">{{ err }}</p>
      }
    } @else {
      <button
        type="button"
        class="w-64 cursor-pointer rounded-lg border-2 border-splash-gold/50 bg-splash-magenta/20 px-6 py-2.5 text-sm font-semibold uppercase tracking-widest text-[#f4e9d8] transition hover:bg-splash-magenta/30"
        (click)="goToAuth()"
      >
        {{ i18n.t('mp.loginRegister') }}
      </button>
      <button
        type="button"
        class="w-64 cursor-pointer rounded-lg border border-splash-gold/30 bg-black/30 px-6 py-2.5 text-sm font-semibold uppercase tracking-widest text-[#cbb9d6]/90 transition hover:border-splash-gold/60"
        (click)="startAnonymous()"
      >
        {{ i18n.t('mp.playAnonymous') }}
      </button>
    }
  </div>
</section>
